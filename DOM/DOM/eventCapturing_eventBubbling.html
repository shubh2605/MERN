<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    /* Code for Propagation */
    #grand-parent {
      width: 300px;
      height: 300px;
      background-color: rgb(213, 37, 37);
    }

    #parent {
      width: 200px;
      height: 200px;
      background-color: rgb(200, 119, 119);
    }

    #child {
      width: 100px;
      height: 100px;
      background-color: rgb(162, 223, 7);
    }

    #grand-child {
      width: 50px;
      height: 50px;
      background-color: rgb(10, 187, 206);
    }

    #grand-parent,
    #parent,
    #child,
    #grand-child {
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>
  <h3>Another Example</h3>
  <div id="grand-parent">
    <div id="parent">
      <div id="child">
        <div id="grand-child"></div>
      </div>
    </div>
  </div>

  <!-- Link Example -->

  <h3>Here is the Link</h3>
  <a href="https://github.com/Laxman67">Click Here </a>
  <script>
    // 1. Select the DOM elements using your HTML ids
    const grandParent = document.getElementById("grand-parent");
    const parent = document.getElementById("parent");
    const child = document.getElementById("child");
    const grandChild = document.getElementById("grand-child");

    // 2. Define a reusable function to log the phase and element id
    const logEvent = (phase, id) => {
      console.log(`${phase}: ${id}`);
    };


    // EVENT CAPTURING PHASE(Top-Down). Passing true as the third argument..........

    grandParent.addEventListener("click", () => logEvent("Capture", "grand-parent"), true);
    parent.addEventListener("click", () => logEvent("Capture", "parent"), true);
    child.addEventListener("click", () => logEvent("Capture", "child"), true);
    grandChild.addEventListener("click", () => logEvent("Capture", "grand-child"), true);

    // EVENT BUBBLING PHASE(Bottom-Up) Passing false as the third argumnet.......... 
    // ==========================================
    grandParent.addEventListener("click", () => logEvent("Bubble", "grand-parent"), false);
    parent.addEventListener("click", () => logEvent("Bubble", "parent"), false);
    child.addEventListener("click", () => logEvent("Bubble", "child"), false);
    grandChild.addEventListener("click", () => logEvent("Bubble", "grand-child"), false);

  </script>
</body>

</html>
